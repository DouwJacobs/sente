name: Publish Sente image
on:
  push:
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
# Serialize all channels so version allocation and aliases cannot race.
concurrency:
  group: sente-publication
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      docker_tag: ${{ steps.metadata.outputs.docker_tag }}
      sha_tag: ${{ steps.metadata.outputs.sha_tag }}
      aliases: ${{ steps.metadata.outputs.aliases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve channel and exact source
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            mode=tag
          elif [ "$REF_NAME" = main ]; then
            mode=main
          elif [ "$REF_NAME" = development ]; then
            mode=development
          else
            echo 'Publication is limited to main, development and SemVer tags' >&2
            exit 1
          fi
          python3 scripts/release-metadata.py --mode "$mode" --ref "$REF_NAME" --run-number "$RUN_NUMBER" --output github
          if [ "$mode" = tag ]; then
            git merge-base --is-ancestor HEAD origin/main || git merge-base --is-ancestor HEAD origin/development
          fi
  verify:
    needs: metadata
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      full: true
  publish:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SENTE_VERSION: ${{ needs.metadata.outputs.version }}
      SENTE_COMMIT: ${{ needs.metadata.outputs.commit }}
      SENTE_BUILD_TIME: ${{ needs.metadata.outputs.built_at }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      IMAGE_TAG: ${{ needs.metadata.outputs.docker_tag }}
      SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
      IMAGE_ALIASES: ${{ needs.metadata.outputs.aliases }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Install OCI copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build candidate with provenance and SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/sente-image.tar
          provenance: mode=max
          sbom: true
          build-args: |
            SENTE_VERSION=${{ env.SENTE_VERSION }}
            SENTE_COMMIT=${{ env.SENTE_COMMIT }}
            SENTE_BUILD_TIME=${{ env.SENTE_BUILD_TIME }}
      - name: Load and test the production image
        timeout-minutes: 5
        run: |
          python3 scripts/load-release-image.py /tmp/sente-image.tar sente:verify
          python3 scripts/test-release-image.py sente:verify --version "$SENTE_VERSION" --commit "$SENTE_COMMIT"
      - name: Publish verified OCI archive without rebuilding
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py /tmp/sente-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence-${{ github.run_number }}
          path: work/release/
          retention-days: 90
