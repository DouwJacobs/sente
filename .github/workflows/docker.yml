name: Publish Sente image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || printf dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SENTE_VERSION=${{ steps.metadata.outputs.version }}
            SENTE_COMMIT=${{ steps.metadata.outputs.commit }}
            SENTE_BUILD_TIME=${{ steps.metadata.outputs.built_at }}
          push: true
          tags: douwjacobs/sente:${{ github.event_name == 'push' && 'latest' || 'development' }}
